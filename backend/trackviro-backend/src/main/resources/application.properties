spring.application.name=trackviro-backend

# ?? Database: trackviro ONLY. Never expense_db. ?????????????????
# Credentials come from environment variables ? nothing hardcoded,
# even at this early stage.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trackviro}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# "update" is safe right now because there are no entities yet ?
# there is nothing for Hibernate to create or change. This is the
# same setting you'll keep once entities exist, matching the old
# project's behaviour, just pointed at a different schema.
spring.jpa.hibernate.ddl-auto=update

# Slightly more visible logging for this connection-proving step only.
logging.level.org.hibernate.SQL=INFO
logging.level.com.zaxxer.hikari=DEBUG

app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS10cmFja3Zpcm8ta2V5LTEyMzQ1Njc4}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Email / OTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Uploads
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB